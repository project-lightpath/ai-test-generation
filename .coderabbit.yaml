language: "en-US"

# Keep repository review behavior within CodeRabbit's free-tier feature set.
enable_free_tier: true

reviews:
  profile: "assertive"
  high_level_summary: true
  high_level_summary_instructions: |
    Review the pull request as one cohesive change set. Produce a consolidated
    summary covering architecture, contract/state compatibility, tests, CI,
    security, and unresolved follow-up work. Group related findings and avoid
    repeating the same issue across files. Prioritize correctness,
    regressions, data loss, security, and meaningful test gaps over style.
  poem: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!PR-SUMMARY-*.md"
    - "!.kilo/**"
    - "!.venv/**"
    - "!**/__pycache__/**"
    - "!**/generated/**"
    - "!_site/**"
  path_instructions:
    - path: "**"
      instructions: |
        Review the complete change set in repository context rather than files
        in isolation. Check that public contracts, implementation, persistence,
        tests, documentation, and CI agree. Prefer explicit, fail-closed
        behavior; preserve evidence and identity; validate untrusted input at
        boundaries; and flag unsupported success states, data loss, ambiguous
        outcomes, unsafe concurrency, or weak error semantics.
    - path: "contracts/**"
      instructions: |
        Review schema correctness, compatibility, cross-document consistency,
        examples, negative fixtures, and override behavior. Require explicit
        non-success outcomes and supporting evidence for positive outcomes.
        Ensure serialized producer output can validate against these contracts.
    - path: "src/atg/**/*.py"
      instructions: |
        Review lifecycle invariants, typed boundaries, idempotency, revision and
        transaction semantics, persistence/replay consistency, concurrency,
        recovery, resource lifecycle, and stable structured errors. Verify that
        terminal and retry behavior cannot retain stale state.
    - path: "tests/**/*.py"
      instructions: |
        Require meaningful assertions on complete values and structures rather
        than existence, broad truthiness, or substring-only checks. Check
        positive, negative, boundary, stale, duplicate, concurrency,
        persistence, replay, and recovery behavior where relevant. Ensure tests
        prove the behavior they claim and fail when that behavior regresses.
    - path: "scripts/**"
      instructions: |
        Review deterministic validation and publication, safe path handling,
        reproducible outputs, explicit configuration selection, and clear
        failures for missing or invalid inputs.
    - path: ".github/workflows/**"
      instructions: |
        Review least-privilege permissions, trigger and branch restrictions,
        reproducible dependencies, rerun-safe artifacts, secret exposure,
        deployment prerequisites, and action versioning risks.

chat:
  auto_reply: true
