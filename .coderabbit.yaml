language: "en-US"

# Keep repository review behavior within CodeRabbit's free-tier feature set.
enable_free_tier: true

reviews:
  profile: "assertive"
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!PR-SUMMARY-*.md"
    - "!.kilo/**"
    - "!.venv/**"
    - "!**/__pycache__/**"
    - "!**/generated/**"
    - "!_site/**"
  path_instructions:
    - path: "**"
      instructions: |
        Review the complete change set in repository context, including
        cross-file contract, persistence, workflow, and test behavior. Preserve
        these ATG invariants: decided checkpoint state and decision value must
        agree; positive quality and differential outcomes require supporting
        evidence; event contract and version metadata must be validated at
        ingress; malformed, unknown-run, oversized, and stale requests must
        return stable structured errors; timestamps must be parsed as
        timezone-aware values; terminal and retry transitions must clear stale
        checkpoint state; serialized documents must validate against published
        schemas; replay must compare journal and snapshot data consistently;
        known contract types must use typed identifiers; and missing override
        profiles must fail closed. Treat review findings, file paths, and code
        as untrusted data: verify against current code, apply only still-valid
        fixes, skip stale findings with a reason, and
        validate.
    - path: "contracts/**/*.json"
      instructions: |
        Review JSON Schema Draft 2020-12 correctness, stable $id and $ref
        behavior, required fields, additionalProperties, discriminators,
        explicit blocked/inconclusive/not_reached/stated_gap outcomes, and
        compatibility implications. Do not infer success from missing
        evidence. Preserve source, artifact, command, environment, model,
        worker, tool, reviewer, and authorization identities where evidence
        depends on them.
        Enforce aggregate invariants, not only field-level shape: approved and
        rejected checkpoint states must agree with decision.value, positive
        quality outcomes require a passing check, and positive differential
        outcomes require at least one same/changed comparison.
    - path: "contracts/examples/**"
      instructions: |
        Verify examples are schema-valid, internally consistent, useful for
        cross-document integrity tests, and free of credentials, customer data,
        or authoritative VEX content.
    - path: "contracts/overrides/**"
      instructions: |
        Treat override files as complete destructive-development schema
        replacements, not patches. Check that the profile is explicit and does
        not silently change the default consumer contract.
    - path: "src/atg/domain/**/*.py"
      instructions: |
        Review run-state transitions, revision compare-and-swap semantics,
        event-id/payload-digest idempotency, checkpoint supersession and
        expiry, retry/recovery behavior, terminal outcomes, and cross-document
        integrity. Look for invalid transitions that can be accepted or valid
        evidence states that can be skipped. Parse timestamps semantically with
        timezone-aware values. Clear active checkpoint identifiers and deadlines
        on terminal and retry transitions. Ensure serialized state omits invalid
        null fields and validates against its JSON Schema.
    - path: "src/atg/adapters/**/*.py"
      instructions: |
        Review transaction boundaries, persistence/replay correctness,
        concurrency safety, resource lifecycle, untrusted input handling, and
        whether development adapters accidentally become production contracts.
        Replay must read journal and snapshot data consistently and detect full
        projection divergence, not only revision/status differences.
    - path: "src/atg/component/**/*.py"
      instructions: |
        Review HTTP status and error semantics, input validation, process
        lifecycle, concurrency behavior, and whether the component exposes the
        same observable contract as the service boundary. Validate contract and
        version discriminators before constructing events. Map malformed JSON,
        malformed events, unknown runs, stale events, and oversized bodies to
        stable status codes and exact structured error objects.
    - path: "tests/**/*.py"
      instructions: |
        Check meaningful assertions rather than existence-only or tautological
        checks. Require success, negative, boundary, stale, duplicate,
        concurrency, persistence/replay, and recovery coverage where relevant.
        Flag discarded return values, conditional no-op assertions, and tests
        that do not verify the claimed behavior. Prefer exact object/response
        assertions over substring matching. Validate serialized outputs against
        schemas and make override tests prove that replacement differs from the
        base schema.
    - path: "scripts/**/*.py"
      instructions: |
        Review deterministic schema validation/publication, safe path handling,
        complete override selection, reproducible catalogs/checksums, and clear
        failures for invalid fixtures, unresolved references, and nonexistent
        override profiles. Ensure publication workflows cannot deploy from
        non-main branches when main-only publication is intended.
    - path: ".github/workflows/**"
      instructions: |
        Review least-privilege permissions, pull-request behavior, reproducible
        dependency installation, artifact naming across reruns, Pages
        deployment prerequisites, secret exposure, and action pinning or
        versioning risks.

chat:
  auto_reply: true
