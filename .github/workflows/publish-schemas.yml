name: Publish ATG Schemas

on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/publish-schemas.yml"
  workflow_dispatch:
    inputs:
      override_profile:
        description: "Optional contracts/overrides profile to publish"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -e '.[test]'
      - name: Validate and build schema site
        env:
          OVERRIDE_PROFILE: ${{ inputs.override_profile }}
        run: |
          if [ -n "$OVERRIDE_PROFILE" ]; then
            if [[ "$OVERRIDE_PROFILE" == "." || "$OVERRIDE_PROFILE" == ".." || ! "$OVERRIDE_PROFILE" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "Invalid override profile name"
              exit 1
            fi
            python scripts/validate_contracts.py --override-root "contracts/overrides/$OVERRIDE_PROFILE"
            python scripts/publish_schemas.py --output _site --clean --override-root "contracts/overrides/$OVERRIDE_PROFILE"
          else
            python scripts/validate_contracts.py
            python scripts/publish_schemas.py --output _site --clean
          fi
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
