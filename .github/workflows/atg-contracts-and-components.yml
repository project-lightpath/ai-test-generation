name: Test ATG Contracts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "contracts/**"
      - "docs/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "contracts/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Validate schemas and fixtures
        run: python scripts/validate_contracts.py
      - name: Run unit, contract, and component tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_*.py' -v
