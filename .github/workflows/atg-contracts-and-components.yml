name: Validate ATG Contracts and Components

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "contracts/**"
      - "docs/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "contracts/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Validate schemas and fixtures
        run: python scripts/validate_contracts.py
      - name: Verify installed wheel contract assets
        run: |
          python -m pip wheel . --wheel-dir "$RUNNER_TEMP/wheels"
          python -m venv "$RUNNER_TEMP/atg-wheel"
          "$RUNNER_TEMP/atg-wheel/bin/pip" install "$RUNNER_TEMP"/wheels/atg_reference-*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/atg-wheel/bin/python" -c 'from atg.domain.schema_validation import contract_asset_path; assert (contract_asset_path("v1") / "analysis.schema.json").is_file()'
      - name: Run unit tests
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests/unit -p 'test_*.py' -v
      - name: Run contract tests
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests/contract -p 'test_*.py' -v
      - name: Run component tests
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests/component -p 'test_*.py' -v
